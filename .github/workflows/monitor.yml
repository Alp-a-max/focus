name: Refresh public satellite monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
    # Avoid a bot-triggered refresh loop when only the derived feed changes.
    paths-ignore:
      - 'assets/monitor-feed.json'
permissions:
  contents: write
concurrency:
  group: focus-public-monitor
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ml/requirements-monitor.txt
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: |
            ml/output/pretrained
            ml/datasets/pretrained-context
          key: focus-unetpp12-v1-${{ github.run_id }}
          restore-keys: focus-unetpp12-v1-
      - name: Install CPU inference environment
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ml/requirements-monitor.txt
          python -c "import sys; print('FOCUS_DETECTOR_PYTHON='+sys.executable)" >> "$GITHUB_ENV"
      - name: Verify published model and refresh real observations
        run: |
          python ml/setup_pretrained.py
          node tools/refresh-monitor.cjs
      - name: Publish only the derived public feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/monitor-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated multi-region satellite results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
